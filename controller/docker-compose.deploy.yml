# EchoHome setup tool — deploy from the published image (no build needed).
#
#   mkdir echohome && cd echohome
#   curl -O https://raw.githubusercontent.com/ggg1psyyy/EchoHome/main/controller/docker-compose.deploy.yml
#   curl -o .env https://raw.githubusercontent.com/ggg1psyyy/EchoHome/main/controller/.env.example
#   # optional: set SERVER_IP in .env to this machine's LAN IP
#   docker compose -f docker-compose.deploy.yml up -d
#
# :latest moves only with GA releases; for Early Access pin the tag
# (echohome-controller:3.0.0-ea.1).
#
# Dashboard: http://<SERVER_IP>:8768
#
# network_mode: host is required — the controller advertises itself and each
# Echo's Voice Incubator satellite over mDNS, which doesn't work behind
# Docker's port mapping.

services:
  echohome-controller:
    image: ghcr.io/ggg1psyyy/echohome-controller:latest
    container_name: echohome-controller
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      # Persist database (devices, config, users) across upgrades
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
