services:
  echohome-controller:
    build:
      context: .
    container_name: echohome-controller
    restart: unless-stopped
    network_mode: host
    environment:
      - DEBUG=1
    env_file:
      - .env
    volumes:
      # Persist database across container rebuilds
      - ~EchoMuse/controller/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
